- insert:
    - id: dsh-memory
      # Relative to this patch file, so the bundle works from wherever it is installed.
      name: ./index.js
      config:
        # Python interpreter that can import `memory_system`.
        pythonPath: ''
        # Repository root that owns the `memory_system` package; empty means the
        # directory one level above this file.
        memorySystemRoot: ''
        # Directory holding memory.db; empty means ~/.dsh/memory.
        memoryHome: ''
        # Freeze the project id instead of deriving it from the session cwd.
        projectOverride: ''
        # Snapshot conversation turns into episodic memory after each turn.
        captureTurns: true
        # Generate a fresh digest automatically once the turn settles and the
        # harness goes idle. Always on; there is no user-facing switch.
        autoSummary: true
        # Idle gap (ms) after a settled turn before that digest is generated.
        autoSummaryDelayMs: 15000
        # Inject the memory anchor block into the system prompt.
        systemPromptAnchor: true
        # Per-bridge-request timeout in ms.
        requestTimeoutMs: 60000
        # Default scope for the "记忆摘要生成" button: project | global.
        digestScope: project
        # Embedding preset forwarded to MemoryConfig (empty = library default).
        embeddingPreset: ''
