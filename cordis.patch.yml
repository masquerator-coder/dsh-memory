# dsh-memory — bundle patch
#
# Applied automatically when the package is installed as a profile bundle:
# `dsh plugin --profile <name> add <spec>` mounts this file as that bundle
# layer's loader patch. The loader resolves `name: dsh-memory` against the
# profile's dependency graph, then calls the package's `apply` with `config`.

- insert:
    - id: memory
      name: dsh-memory
      config:
        enableInjection: true # always-on Tier-0 memory section in the system prompt
        # forgetEnabled: true     # active forgetting (demote/archive/hard-delete)
        # forgetDays:             # expected time-to-forget (days until heat ≈ 0.05)
        #   env: 365
        #   lesson: 180
        #   decision: 90
        #   general: 60
        # windowDays: 30          # frequency sliding window (recall-count boost)
        # episodeRetentionDays: 180  # episodes older than this are archived
        # budgetTier0: 900
        # budgetUser: 400
        # budgetMemory: 500
        # importanceThreshold: 3
        # memoryHome: /abs/path    # override storage dir (default <DSH_HOME>/memory)
