# dsh-memory bundle layer.
#
# Mounts the memory plugin into the runtime's plugin tree. This is an insert
# (not an id-targeted override) because the base layer has no row of id
# `memory` — insert rows carry a `name`; override rows, which would omit it,
# are for replacing an existing loader id.
#
# `dataFile` defaults to empty (in-memory). To persist across restarts, set it
# to a real path in your profile's cordis.patch.yml, e.g.:
#   - id: memory
#     name: dsh-memory
#     config:
#       dataFile: "~/.dsh/memory/facts.json"
- insert:
    - id: memory
      name: dsh-memory
      config:
        profile: personal
        injectContext: true
        captureEnabled: true
        llmExtractionEnabled: false
        dataFile: ""
